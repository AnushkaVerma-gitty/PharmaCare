spring.application.name=PharmaCare
server.port=8080

# H2 database saved as a file in the "data" folder (data stays after restart)
spring.datasource.url=jdbc:h2:file:./data/pharmacydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Create/update tables automatically from the Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Browser database viewer: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

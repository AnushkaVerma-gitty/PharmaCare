<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Medicine')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<main>
    <h1 th:text="${medicine.id == null} ? 'Add Medicine' : 'Edit Medicine'">Add Medicine</h1>

    <div class="card">
        <form th:action="@{/medicines/save}" th:object="${medicine}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-grid">
                <div>
                    <label>Name *</label>
                    <input type="text" th:field="*{name}">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div>
                    <label>Category</label>
                    <select th:field="*{category}">
                        <option value="">-- Select --</option>
                        <option th:each="c : ${ {'Tablet','Capsule','Syrup','Injection','Ointment','Drops','Other'} }"
                                th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>
                <div>
                    <label>Manufacturer</label>
                    <input type="text" th:field="*{manufacturer}">
                </div>
                <div>
                    <label>Batch Number</label>
                    <input type="text" th:field="*{batchNumber}">
                </div>
                <div>
                    <label>Price (₹) *</label>
                    <input type="number" step="0.01" min="0" th:field="*{price}">
                    <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div>
                    <label>Quantity *</label>
                    <input type="number" min="0" th:field="*{quantity}">
                    <div class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                </div>
                <div>
                    <label>Reorder Level</label>
                    <input type="number" min="0" th:field="*{reorderLevel}">
                </div>
                <div>
                    <label>Expiry Date</label>
                    <input type="date" th:field="*{expiryDate}">
                </div>
                <div>
                    <label>Supplier</label>
                    <select th:field="*{supplier.id}">
                        <option value="">-- None --</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
            </div>
            <div style="margin-top:20px" class="actions">
                <button class="btn" type="submit">Save</button>
                <a class="btn btn-secondary" th:href="@{/medicines}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>

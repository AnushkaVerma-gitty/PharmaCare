<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>

        <form id="registrationForm" novalidate>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
            <span class="error" id="nameError"></span>

            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="example@email.com">
            <span class="error" id="emailError"></span>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="10-digit phone number">
            <span class="error" id="phoneError"></span>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
            <span class="error" id="dobError"></span>

            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <span class="error" id="genderError"></span>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password">
            <span class="error" id="passwordError"></span>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
            <span class="error" id="confirmPasswordError"></span>

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>
            <span class="error" id="addressError"></span>

            <button type="submit">Register</button>

            <p id="successMessage"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
